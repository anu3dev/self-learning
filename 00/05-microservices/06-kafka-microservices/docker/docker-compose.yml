# Docker Compose version
# 3.9 is a stable version supported by modern Docker Desktop.
version: '3.9'

services:

  # Service name
  # Docker will create a container named "kafka".
  kafka:

    # Official Apache Kafka Docker image (Kafka 4.0 running in KRaft mode)
    image: apache/kafka:4.0.0

    # Friendly container name instead of a random generated one.
    container_name: kafka

    # Expose Kafka port to your local machine.
    #
    # Left Side  = Host Machine Port
    # Right Side = Container Port
    #
    # localhost:9092  --->  Kafka inside Docker
    ports:
      - "9092:9092"

    environment:

      #####################################################
      # KAFKA NODE ID
      #####################################################

      # Every Kafka broker must have a unique ID.
      #
      # Production Example:
      #
      # Broker 1 -> Node ID = 1
      # Broker 2 -> Node ID = 2
      # Broker 3 -> Node ID = 3
      #
      # Since we only have ONE broker,
      # Node ID = 1
      KAFKA_NODE_ID: 1


      #####################################################
      # PROCESS ROLES
      #####################################################

      # Kafka 4.x uses KRaft mode instead of ZooKeeper.
      #
      # A Kafka node can play one or both roles:
      #
      # broker
      #     Stores messages.
      #
      # controller
      #     Manages metadata such as:
      #       - Topics
      #       - Partitions
      #       - Leader Election
      #
      # In production these are often separate machines.
      #
      # For learning we combine them.
      KAFKA_PROCESS_ROLES: broker,controller


      #####################################################
      # LISTENERS
      #####################################################

      # Kafka opens two ports.
      #
      # PLAINTEXT : Used by Spring Boot applications.
      #
      # CONTROLLER : Used internally by Kafka Controller.
      #
      # Think of it like:
      #
      # 9092 -> Client traffic
      # 9093 -> Internal Kafka communication
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093


      #####################################################
      # ADVERTISED LISTENERS
      #####################################################

      # This is VERY IMPORTANT.
      #
      # Kafka tells clients:
      #
      # "If you want to connect to me,
      #  use localhost:9092"
      #
      # Without this,
      # clients often connect successfully
      # but later fail while producing messages.
      #
      # In Docker Compose with multiple containers,
      # this value changes.
      #
      # We'll discuss that later.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092


      #####################################################
      # CONTROLLER LISTENER
      #####################################################

      # Which listener should be used
      # for controller communication?
      #
      # Answer:
      #
      # CONTROLLER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER


      #####################################################
      # SECURITY PROTOCOL MAP
      #####################################################

      # Maps listener names
      # to their communication protocol.
      #
      # For learning:
      #
      # PLAINTEXT
      #
      # = No SSL
      # = No Authentication
      #
      # Production may use:
      #
      # SSL
      # SASL_SSL
      # SASL_PLAINTEXT
      #
      # depending on company security policies.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT


      #####################################################
      # CONTROLLER QUORUM
      #####################################################

      # Kafka controllers elect leaders.
      #
      # Production:
      #
      # Controller 1
      # Controller 2
      # Controller 3
      #
      # For local setup,
      # we only have ONE controller.
      #
      # Node 1
      #
      # running on port 9093.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093


      #####################################################
      # OFFSETS TOPIC REPLICATION
      #####################################################

      # Kafka internally stores consumer offsets
      # inside a hidden topic:
      #
      # __consumer_offsets
      #
      # Replication factor means:
      #
      # How many copies?
      #
      # Local:
      #
      # Only one broker
      #
      # Therefore:
      #
      # Replication = 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1


      #####################################################
      # TRANSACTION LOG REPLICATION
      #####################################################

      # Used for Kafka Transactions.
      #
      # Again,
      # only one broker exists.
      #
      # Therefore replication = 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1


      #####################################################
      # MINIMUM IN-SYNC REPLICAS
      #####################################################

      # Minimum number of replicas
      # that must acknowledge writes.
      #
      # Production:
      #
      # Usually:
      #
      # 2
      #
      # Local:
      #
      # Only one broker exists.
      #
      # Therefore:
      #
      # 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


      #####################################################
      # CLUSTER ID
      #####################################################

      # Every Kafka cluster has a unique ID.
      #
      # Think of it as
      # the UUID of the Kafka Cluster.
      #
      # This value remains stable
      # unless the cluster is recreated.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk


    #####################################################
    # RESTART POLICY
    #####################################################

    # Automatically restart Kafka
    # if Docker or the machine restarts.
    restart: unless-stopped